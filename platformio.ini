; Temporary build config for local verification
[platformio]
src_dir = .

[env:bluepill]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = custom
extra_scripts = post:tools/stlink_upload.py
build_src_filter =
    +<bootloader/Core/Src/>
    +<shared/>
    -<.git/>
    -<.pio/>
    -<application/>
    -<esp32-comm-bridge/>
    -<tools/>
    -<docs/>
build_flags =
    -I bootloader/Core/Inc
    -I shared
board_build.ldscript = bootloader/STM32F103C8TX_BOOT.ld

[env:app]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = custom
extra_scripts = post:tools/stlink_upload.py
build_src_filter =
    +<application/Core/Src/>
    +<application/lib/FreeRTOS/src/>
    +<shared/>
    -<.git/>
    -<.pio/>
    -<bootloader/>
    -<esp32-comm-bridge/>
    -<tools/>
    -<docs/>
    -<lowpower-probe/>
    -<application/lib/FreeRTOS/include/>
build_flags =
    -I application/Core/Inc
    -I application
    -I shared
    -I application/lib/FreeRTOS/include
    -Wall
    -Wextra
    -Werror
    -Wno-unused-parameter
board_build.ldscript = application/STM32F103C8TX_APP.ld

[env:probe]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = custom
extra_scripts = post:tools/stlink_upload.py
build_src_filter =
    +<lowpower-probe/Core/Src/>
    -<.git/>
    -<.pio/>
    -<application/>
    -<bootloader/>
    -<esp32-comm-bridge/>
    -<tools/>
    -<docs/>
    -<shared/>
build_flags =
    -I shared
    -Wall
    -Wextra
    -Werror
    -Wno-unused-parameter
board_build.ldscript = application/STM32F103C8TX_APP.ld
