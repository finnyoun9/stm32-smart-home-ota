; PlatformIO project for ESP32 Communication Bridge
; Handles Bluetooth SPP + WiFi OTA download → UART to STM32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
; Hardware verified with esptool flash_id: JEDEC c4:6016, 4MB.
board_upload.flash_size = 4MB
; This CH340 board does not auto-enter the ROM downloader reliably.
; Put it in download mode manually (BOOT held while tapping EN) before upload.
board_upload.before_reset = no_reset
; Partition table must define a "storage" SPIFFS partition for fw staging
board_build.partitions = partitions.csv

; NOTE: ESP-IDF ignores build_src_filter (CMake-driven). The shared protocol has
; exactly one copy: ../../shared/protocol.c. It is compiled here by the
; components/shared_protocol component, so CMake hands it to the C compiler
; (files sitting next to main.cpp in src/ would get C++ flags, which this C
; source does not accept). There is no .cpp mirror to keep in sync any more.
; ota_config.c is intentionally NOT built on ESP32 — it targets STM32 flash HAL.
build_flags =
    ; Bluetooth is enabled via sdkconfig.defaults (Kconfig), not -D flags.
    -I $PROJECT_DIR/../shared
    ; Override credentials here instead of editing source:
    ; -D WIFI_SSID='"your_ssid"'
    ; -D WIFI_PASSWORD='"your_password"'

lib_deps =

; ESP32 UART2 pins for STM32 communication
; GPIO16 = RX (from STM32 USART1 TX / PA9)
; GPIO17 = TX (to STM32 USART1 RX / PA10)
;
; Connect: ESP32 GND ↔ STM32 GND
;          ESP32 GPIO16 ← STM32 PA9 (TX)
;          ESP32 GPIO17 → STM32 PA10 (RX)
