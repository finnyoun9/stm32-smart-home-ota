; PlatformIO project for ESP32 Communication Bridge
; BT SPP + WiFi AP/STA + HTTP Web Dashboard + WebSocket Telemetry + MQTT

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200

; Partition table with SPIFFS storage (384KB for web dashboard)
board_build.partitions = partitions.csv

; Flash settings
board_build.flash_mode = dio
board_build.f_flash = 40000000L

; ESP-IDF build flags
build_flags =
    -D CONFIG_BT_SPP_ENABLED=1
    -D CONFIG_BT_CLASSIC_ENABLED=1
    -D CONFIG_ESP_HTTP_CLIENT_ENABLE_HTTPS=0
    -D CONFIG_ESP_HTTPS_SERVER_ENABLE=0


; UART2 pins for STM32 communication
; GPIO16 = RX (from STM32 TX / PA2)
; GPIO17 = TX (to STM32 RX / PA3)
;
; Connect:
;   ESP32 GND ↔ STM32 GND
;   ESP32 GPIO16 ← STM32 PA2 (TX)
;   ESP32 GPIO17 → STM32 PA3 (RX)
