name: Firmware CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 协议实现只有一份：shared/protocol.c。ESP32 侧不再有 C++ 副本，
      # 而是由 esp32-comm-bridge/components/shared_protocol/ 这个独立 IDF 组件
      # 用 C 编译器直接编译该文件。这里断言副本确实不存在了——它的回归会立刻
      # 重新引入「同一职责两个 owner」的漂移风险。
      - name: Assert protocol has a single source of truth
        run: |
          if [ -e esp32-comm-bridge/src/protocol.cpp ]; then
            echo "::error::esp32-comm-bridge/src/protocol.cpp 又出现了。" \
                 "shared/protocol.c 是协议的唯一来源，请改用 shared_protocol 组件，不要重建副本。"
            exit 1
          fi
          echo "OK: shared/protocol.c 是唯一来源，ESP32 通过 shared_protocol 组件编译它。"

      - name: Set up PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build STM32 bootloader
        run: pio run -e bluepill

      - name: Build STM32 application
        run: pio run -e app

      - name: Build STM32 low-power probe
        run: pio run -e probe

      - name: Build ESP32 bridge
        run: pio run -d esp32-comm-bridge

      # 构建体积报告：调用各目标的 PlatformIO size 目标，打印 RAM/Flash 占用，
      # 便于 Review PR 时看到体积变化。实现要点：
      #   1. 本步骤不带 if: always()，因此任一编译失败时会被跳过，不会执行，
      #      也就不会掩盖或顶替原来的失败步骤；
      #   2. 单个目标的 size 异常只产生 warning 注解，不改变本步骤退出码，
      #      既不会让报告本身变成新的失败点，也不会吞掉其它目标的输出。
      - name: Report firmware size
        run: |
          set -u
          failed=0
          report_size() {
            name="$1"
            shift
            echo "::group::${name} RAM/Flash"
            if ! "$@"; then
              echo "::warning title=体积报告失败::${name} 未输出可读取的 size 结果（构建产物缺失或 size 目标异常）"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          }
          report_size "STM32 bootloader (bluepill)" pio run -e bluepill -t size
          report_size "STM32 application (app)" pio run -e app -t size
          report_size "STM32 low-power probe (probe)" pio run -e probe -t size
          report_size "ESP32 bridge (esp32dev)" pio run -d esp32-comm-bridge -t size
          if [ "${failed}" -ne 0 ]; then
            echo "体积报告：${failed} 个目标未输出 size 结果，详见上方 warning 注解（不阻断 CI）。"
          else
            echo "体积报告：4 个目标均已输出 RAM/Flash 占用。"
          fi

      - name: Run shared protocol smoke test
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Ishared \
            tools/protocol_smoke_test.c shared/protocol.c \
            -o protocol_smoke_test
          ./protocol_smoke_test

      # 协议边界矩阵：粘包/拆包/前导垃圾/非法长度/位翻转/最大与零长度 payload。
      # 纯 C11 + 零依赖，约 3 秒。
      - name: Run protocol boundary test matrix
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Ishared \
            tools/protocol_boundary_test.c shared/protocol.c \
            -o protocol_boundary_test
          ./protocol_boundary_test

      # 配置区双副本（ping-pong）的选择逻辑：模拟「写入中断后旧副本必须胜出」。
      # ota_config.c 依赖 STM32 HAL 无法在主机链接，故测试的是同规则的模型。
      - name: Run OTA config ping-pong logic test
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Ishared \
            tools/ota_config_logic_test.c shared/protocol.c \
            -o ota_config_logic_test
          ./ota_config_logic_test
